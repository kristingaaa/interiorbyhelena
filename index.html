        </ul>

    </section>

          <h3 data-i18n="pk1.name"></h3>
          <p class="desc" data-i18n="pk1.desc"></p>
          <ul>
            <li data-i18n="pk1.l1"></li><li data-i18n="pk1.l2"></li><li data-i18n="pk1.l3"></li><li data-i18n="pk1.l4"></li>

          <p class="price"><span data-i18n="pk1.price"></span> <small data-i18n="pk.priceNote"></small></p>
          <a class="btn btn-ghost pick" href="#kontakt" data-package="style" data-i18n="pk.btn"></a>
        </article>

        <article class="package featured" data-tags="style layout">
          <p class="badge" data-i18n="pk2.badge"></p>
          <p class="eyebrow small" data-i18n="pk2.eyebrow"></p>
          <h3 data-i18n="pk2.name"></h3>
          <p class="desc" data-i18n="pk2.desc"></p>

    <!-- Kontakt -->
    <section class="contact" id="kontakt" aria-labelledby="contact-title">
      <div class="wrap contact-grid">
        <div>
          <p class="eyebrow" data-i18n="contact.eyebrow"></p>
          <h2 class="title" id="contact-title" data-i18n="contact.title"></h2>
          <p data-i18n="contact.text"></p>
        </div>

        <form id="contact-form" novalidate>
          <p class="form-summary" id="form-summary" role="alert" hidden></p>

          <div class="field">
            <label for="f-name" data-i18n="f.name"></label>
            <input id="f-name" name="name" type="text" autocomplete="name" required data-i18n-attr="placeholder:f.name.ph" aria-describedby="e-name">
            <p class="error" id="e-name" hidden></p>
          </div>

          <div class="field">
            <label for="f-email" data-i18n="f.email"></label>
            <input id="f-email" name="email" type="email" autocomplete="email" required data-i18n-attr="placeholder:f.email.ph" aria-describedby="e-email">
            <p class="error" id="e-email" hidden></p>
          </div>

          <div class="field">
            <label for="f-package" data-i18n="f.package"></label>
            <select id="f-package" name="package">
              <option value="" data-i18n="f.package.none"></option>
              <option value="style" data-i18n="pk1.name"></option>
              <option value="design" data-i18n="pk2.name"></option>
              <option value="complete" data-i18n="pk3.name"></option>
            </select>
          </div>

          <div class="field">
            <label for="f-message" data-i18n="f.message"></label>
            <textarea id="f-message" name="message" rows="5" required data-i18n-attr="placeholder:f.message.ph" aria-describedby="e-message"></textarea>
            <p class="error" id="e-message" hidden></p>
          </div>

          <button class="btn" type="submit" data-i18n="f.submit"></button>
          <p class="hint" data-i18n="f.hint"></p>
          <p class="success" id="form-ok" role="status" hidden></p>
        </form>
      </div>
    </section>
